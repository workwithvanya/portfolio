<style>
:root{
  --bg:#000;            /* background */
  --ink:#f0e6cf;        /* cream text */
  --mute:rgba(240,230,207,.55);
  --line:rgba(240,230,207,.18);
  --pop:#e6ff00;        /* cursor and hover accent */
  --serif:"Old Standard TT",serif; --display:"Antic Didone",serif;
  --mono:"Roboto Mono",monospace; --plex:"IBM Plex Mono",monospace;
  --some:"Sometype Mono",monospace; --over:"Overpass Mono",monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.65 var(--serif);overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:1px dashed var(--pop);outline-offset:4px}
@media (hover:hover) and (pointer:fine){*{cursor:none!important}}
#cur{position:fixed;width:12px;height:12px;border-radius:50%;background:var(--ink);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);top:50%;left:50%;opacity:0;transition:background-color .3s,width .3s,height .3s}
#cur.hover{background:var(--pop);width:8px;height:8px}
@media (hover:none),(pointer:coarse){#cur{display:none}}
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:var(--pop);transform:scaleX(0);transform-origin:0 50%;z-index:60}
/* clock, top right */
.tr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);right:22px;z-index:55;text-align:right;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.7)}
.tr .status{justify-content:flex-end}
/* intro with hover phrases */
.intro{font:400 clamp(28px,4.4vw,54px)/1.2 var(--display);margin:0;max-width:20em}
.hp{position:relative;display:inline;border-bottom:1px dotted var(--ink);transition:background .25s,color .25s,opacity .25s}
.hp:hover,.hp:focus-visible{background:var(--pop);color:#000;border-color:transparent}
.intro:has(.hp:hover) .hp:not(:hover),.intro:has(.hp:focus-visible) .hp:not(:focus-visible){opacity:.3}
.hc{display:none;position:absolute;left:0;top:100%;margin-top:10px;width:min(340px,80vw);padding:12px 14px;background:#141414;border:1px solid var(--line);color:var(--ink);font:400 14px/1.55 var(--mono);z-index:20}
.hp:hover .hc,.hp:focus-visible .hc{display:block}
/* sidebar */
aside{position:fixed;top:0;right:0;width:300px;height:100vh;padding:96px 24px 22px;display:flex;flex-direction:column;justify-content:space-between;font:400 14px/1.6 var(--over);z-index:40;overflow:auto}
.clock{font:500 16px var(--some);font-variant-numeric:tabular-nums}
.status{display:flex;gap:8px;align-items:center;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:#d33;animation:pulse 1.5s infinite}
.dot.on{background:#2fbf6b}
@keyframes pulse{50%{transform:scale(.8);opacity:.4}}
.idx a{display:block;text-decoration:none;padding:2px 0;opacity:.2;transition:opacity .3s}
.idx a.on,.idx a:hover{opacity:1}
.awbox .at{display:inline-block;text-decoration:none}
.aw{list-style:none;margin:6px 0 0;padding:0;max-height:0;overflow:hidden;opacity:0;transition:max-height .6s,opacity .4s;color:var(--mute)}
.awbox:hover .aw,.awbox:focus-within .aw{max-height:420px;opacity:1}
.links a{display:block;text-decoration:underline;text-underline-offset:3px}
/* main */
main>section:first-child .lab{margin-top:0}
main{margin-right:300px;padding:72px 28px 80px;max-width:1100px}
.big{font:400 clamp(56px,11vw,140px)/.95 var(--display);margin:18px 0 0;overflow:hidden;padding-bottom:.06em}
.big span{display:block;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(105%)}}
.hero img{width:100%;height:auto;display:block;filter:grayscale(.15);transition:filter .5s}
.hero img:hover{filter:none}
h2{font:400 clamp(24px,3vw,34px)/1.2 var(--serif);margin:0 0 18px}
.lab{font:400 13px var(--plex);color:var(--mute);margin:90px 0 14px}
.about{display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:start}
.about img{width:100%;height:auto;display:block;filter:grayscale(1)}
.about p{margin:0 0 1em;max-width:36em}
.skill{border-top:1px solid var(--line);padding:14px 0;font-family:var(--mono);font-size:15px}

.skill:hover .dt,.skill:focus-within .dt{max-height:140px;opacity:1;padding-top:6px}
.skill:hover .n{color:var(--pop)}
.row{display:grid;grid-template-columns:70px 1fr auto;gap:16px;padding:14px 6px;border-top:1px solid var(--line);text-decoration:none;transition:padding-left .35s,color .3s}

.cv-list{list-style:none;counter-reset:n;margin:0;padding:0 0 0 1.6em;font:400 15px/1.7 var(--plex)}

.cv-list li::before{content:counter(n);position:absolute;left:-1.6em;top:-.3em;font-size:.6em}
.cv-list .g{color:var(--mute)}
.ph{outline:1px dashed var(--pop);outline-offset:2px}

.nm{position:relative;display:inline-block}

.blk{position:absolute;left:50%;top:100%;transform:translateX(-50%);width:min(620px,92vw);padding:26px 28px 14px;background:#0c0c0c;border:1px solid var(--line);text-align:left;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .8s cubic-bezier(.2,.8,.2,1),visibility 0s .8s;z-index:30}
.nm:hover .blk,.nm:focus-within .blk,.nm.open .blk{clip-path:inset(0);visibility:visible;transition-delay:0s}

.blk .b{font:400 18px/1.55 var(--serif)}
.blk .c{font:400 13px var(--plex);color:var(--mute)}
.role{margin:12px 0 0;font:italic 400 clamp(14px,1.5vw,18px)/1.4 var(--mono);color:var(--mute);letter-spacing:.04em}
.stack{position:relative;width:min(330px,72vw);aspect-ratio:3/3.9;margin:6vh auto 0;cursor:zoom-in}
.card{position:absolute;inset:0;background:#111;transform-origin:50% 100%;transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg));opacity:var(--o,1);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s;box-shadow:0 18px 44px rgba(0,0,0,.7)}
.card img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.card.out{transform:translate(-125%,-40px) rotate(-16deg);opacity:0}
.cap{margin-top:26px;font:400 14px var(--mono);color:var(--mute);min-height:1.7em}
.fig{margin:0;cursor:zoom-in}
.fig img{width:100%;height:340px;object-fit:cover;object-position:top;display:block;background:#111;transition:transform .5s,filter .4s;filter:brightness(.85)}
.fig:hover img,.fig:focus-visible img{filter:none;transform:scale(1.02)}
.fig .box{overflow:hidden}
.fig figcaption{padding:10px 0 0;font:400 14px/1.5 var(--mono)}
.fig figcaption span{display:block;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
#lb.on{display:flex}#lb img{max-width:94vw;max-height:94vh;object-fit:contain}
.sec-sub{margin:-4px 0 18px;color:var(--mute);max-width:36em}
.hl{display:grid;grid-template-columns:110px 1fr 1fr;gap:16px;padding:14px 8px;border-top:1px solid var(--line);transition:background .2s,color .2s}
.hl:hover,.hl:focus-visible{background:var(--pop);color:#000}
.hl small{font:400 13px var(--plex)}.hl .ph{outline-color:currentColor}
.trk{display:grid;grid-template-columns:34px 1fr 1fr;gap:16px;padding:12px 8px;border-top:1px solid var(--line);transition:background .2s,color .2s}
.trk:hover{background:var(--pop);color:#000}
.trk small{font:400 13px var(--plex)}
.btn{display:inline-block;margin:18px 0 0;padding:10px 18px;border:1px solid var(--ink);border-radius:99px;text-decoration:none;font:400 14px var(--mono);transition:background .2s,color .2s}
.btn:hover{background:var(--pop);color:#000;border-color:var(--pop)}
.pill{display:flex;gap:14px;align-items:center;margin-top:90px;padding:20px 24px;border-radius:14px;background:#161616;font:400 17px var(--mono);text-decoration:none}
.pill:hover{color:var(--pop)}
footer{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:60px;padding-top:18px;border-top:1px solid var(--line);font:400 14px var(--over)}
.js .rv{opacity:0;transform:translateY(14px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.js .rv.in{opacity:1;transform:none}
@media (max-width:900px){
  aside{position:static;width:auto;height:auto;gap:18px;padding:18px;overflow:visible}
  .idx a{opacity:.8}
  main{margin:0;padding:64px 18px 60px}
  .about{grid-template-columns:1fr}.about img{max-width:220px}
  .row{grid-template-columns:1fr;gap:2px}
  .grid{grid-template-columns:1fr}
  .hl,.trk{grid-template-columns:1fr;gap:2px}
  .hc{left:0}
}
@media (hover:none){.skill .dt{max-height:none;opacity:1;padding-top:6px}.aw{max-height:none;opacity:1}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
</style>
</head>

     return '<div class="skill" tabindex="0"><span class="n">'+(s.link?'<a href="'+s.link+'">'+s.name+'</a>':s.name)+'</span><div class="dt">'+ph(s.detail)+'</div></div>'}).join('')+'</section>'+
   '<section id="products" class="rv"><div class="lab">products</div>'+C.products.map(function(p){
     return '<a class="row" href="'+link(p[2])+'"><small>product</small><span><b>'+p[0]+'</b><br>'+ph(p[1])+'</span><small></small></a>'}).join('')+'</section>'+
   '<section id="writing" class="rv"><div class="lab">writing</div>'+C.writing.map(function(w){return row(w[0],w[1],w[2],w[3])}).join('')+'</section>'+
   '<section id="reading" class="rv"><div class="lab">reading</div><p class="sec-sub">'+C.readingSub+'</p>'+C.reading.map(function(r){return hl(r[0],r[1],r[2])}).join('')+'</section>'+
   '<section id="shows" class="rv"><div class="lab">shows on my mind</div><p class="sec-sub">'+C.showsSub+'</p>'+C.shows.map(function(r){return hl(r[0],r[1],r[2])}).join('')+'</section>'+
   '<section id="playlist" class="rv"><div class="lab">playlist for the reader</div><p class="sec-sub">'+C.playlistSub+'</p>'+
     (C.playlistEmbed?'<iframe title="Playlist" src="'+C.playlistEmbed+'" width="100%" height="352" style="border:0;border-radius:12px;margin-bottom:18px" allow="encrypted-media" loading="lazy"></iframe>':'')+
     C.tracks.map(function(r,i){return '<div class="trk"><small>'+(i+1)+'</small><span>'+ph(r[0])+' <small>'+ph(r[1])+'</small></span><span>'+ph(r[2])+'</span></div>'}).join('')+
     (C.playlistUrl?'<a class="btn" href="'+C.playlistUrl+'" target="_blank" rel="noopener">Open the full playlist</a>':'')+'</section>'+
   '<section id="concept" class="rv"><div class="lab">concept work: self-initiated, not client engagements</div>'+C.concept.map(function(c){
     return '<a class="row" href="'+link(c[2])+'"><small>concept</small><span><b>'+c[0]+'</b><br>'+ph(c[1])+'</span><small></small></a>'}).join('')+'</section>'+
   '<section id="cv" class="rv"><div class="lab">cv</div>'+
     '<div class="cv-block"><h2>Work</h2><ol class="cv-list">'+C.jobs.map(function(j){return '<li>'+j[0]+' <span class="g">('+j[1]+')</span>, '+j[2]+'.<br><span class="g">'+j[3]+'</span></li>'}).join('')+'</ol></div>'+
     '<div class="cv-block"><h2>Education</h2><ol class="cv-list">'+C.education.map(function(e){return '<li>'+e[0]+', <span class="g">'+e[1]+'</span>, '+e[2]+'.</li>'}).join('')+'</ol></div>'+
     '<div class="cv-block"><ol class="cv-list">'+C.extras.map(function(e){return '<li>'+e[0]+': <span class="g">'+e[1]+'</span></li>'}).join('')+'</ol></div></section>'+
   '<section id="contact" class="rv"><a class="pill" href="mailto:'+C.email+'"><span>♥</span><span>'+C.contactLine+' '+C.email+'</span></a>'+
   '<footer><span>'+C.location+'</span>'+C.links.map(function(l){return '<a href="'+link(l[1])+'">'+l[0]+'</a>'}).join('')+'</footer></section>';
  /* clock and status */
  var tz={timeZone:C.timezone};
  function tick(){var n=new Date();
    $('#clock').textContent=n.toLocaleTimeString('en-GB',Object.assign({hour12:false},tz));
    var h=parseInt(n.toLocaleString('en-GB',Object.assign({hour:'numeric',hour12:false},tz)),10);
    var d=n.toLocaleString('en-GB',Object.assign({weekday:'long'},tz));
    var on=d!=='Saturday'&&d!=='Sunday'&&h>=C.workHours[0]&&h<C.workHours[1];
    $('#state').textContent=(on?'online':'away')+' · '+C.location.split(',')[0];$('#dot').className='dot'+(on?' on':'')}
  tick();setInterval(tick,1000);
  /* sidebar highlight, reveal, progress */
  var ix=document.querySelectorAll('#idx a');
  var so=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)ix.forEach(function(a){a.classList.toggle('on',a.dataset.s===e.target.id)})})},{rootMargin:'-30% 0px -60% 0px'});
  document.querySelectorAll('section[id]').forEach(function(s){so.observe(s)});
  var ro=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');ro.unobserve(e.target)}})},{threshold:.1});
  document.querySelectorAll('.rv').forEach(function(el){ro.observe(el)});
  var bar=$('#bar');
  addEventListener('scroll',function(){var m=document.documentElement.scrollHeight-innerHeight;bar.style.transform='scaleX('+(m>0?scrollY/m:0)+')'},{passive:true});
  /* lightbox */
  var lb=$('#lb'),lbi=lb.querySelector('img');
  document.querySelectorAll('.fig').forEach(function(f){
    var open=function(){lbi.src=img(f.dataset.k);lb.classList.add('on')};
    f.addEventListener('click',open);f.addEventListener('keydown',function(e){if(e.key==='Enter')open()})});
  lb.addEventListener('click',function(){lb.classList.remove('on')});
  addEventListener('keydown',function(e){if(e.key==='Escape')lb.classList.remove('on')});
  /* photo stack */
  var st=$('#stack');
  if(st){
    var cards=[].slice.call(st.children),order=cards.slice(),n=cards.length,hold=false,cap=$('#cap'),
        X=[0,14,-12,22,-20],Y=[0,-10,-6,-16,-12],R=[-2,3,-4,5,-6];
    var lay=function(){order.forEach(function(c,i){var p=Math.min(i,4);
      c.style.setProperty('--x',X[p]+'px');c.style.setProperty('--y',Y[p]+'px');c.style.setProperty('--r',R[p]+'deg');
      c.style.setProperty('--o',i>4?0:1-p*.16);c.style.zIndex=n-i});cap.textContent=order[0].dataset.t};
    lay();
    var next=function(){if(hold||n<2)return;var top=order[0];top.classList.add('out');
      setTimeout(function(){order.push(order.shift());top.style.transition='none';top.classList.remove('out');lay();void top.offsetWidth;top.style.transition=''},600)};
    if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(next,2800);
    st.addEventListener('mouseenter',function(){hold=true});st.addEventListener('mouseleave',function(){hold=false});
    st.addEventListener('click',function(){lbi.src=img(order[0].dataset.k);lb.classList.add('on')});
  }
  var nm=document.querySelector('.nm');
  if(nm&&matchMedia('(hover:none)').matches)nm.addEventListener('click',function(){nm.classList.toggle('open')});
  /* cursor */
  var cur=$('#cur');
  document.addEventListener('mousemove',function(e){
    cur.style.opacity=1;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';
    cur.classList.toggle('hover',!!e.target.closest('a,img,.hp,.skill,.awbox,.fig,.hl,.trk,.stack,.nm'));
  });
  document.addEventListener('mouseleave',function(){cur.style.opacity=0});
});
</script>
